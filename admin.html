// ============================
// FIXTURE HELPERS
// ============================

function isHome(matches, team) {

  const match =
    matches.find(
      m =>
        m.home === team ||
        m.away === team
    );

  if (!match) {
    return false;
  }

  return match.home === team;

}


function orientRound(
  pairs,
  roundNumber
) {

  const defaults =
    pairs.map(
      (pair, index) => {

        if (
          (index + roundNumber)
          % 2 === 0
        ) {

          return {
            home: pair[0],
            away: pair[1]
          };

        }

        return {
          home: pair[1],
          away: pair[0]
        };

      }
    );


  let best = null;

  let bestFlips = 999;


  for (
    let mask = 0;
    mask < 64;
    mask++
  ) {

    const matches =
      defaults.map(
        (match, index) => {

          if (
            mask &
            (1 << index)
          ) {

            return {
              home: match.away,
              away: match.home
            };

          }

          return {
            home: match.home,
            away: match.away
          };

        }
      );


    const crownsOK =
      isHome(
        matches,
        "Crown A"
      )
      !==
      isHome(
        matches,
        "Crown B"
      );


    const victoriasOK =
      isHome(
        matches,
        "Victoria A"
      )
      !==
      isHome(
        matches,
        "Victoria B"
      );


    if (
      crownsOK &&
      victoriasOK
    ) {

      let flips = 0;


      for (
        let i = 0;
        i < 6;
        i++
      ) {

        if (
          mask &
          (1 << i)
        ) {

          flips++;

        }

      }


      if (
        flips <
        bestFlips
      ) {

        best = matches;

        bestFlips =
          flips;

      }

    }

  }

  return best;

}


// ============================
// FIRST 11 WEEKS
// ============================

function generateFirstHalf() {

  const fixedTeam =
    teams[0];

  let rotating =
    teams.slice(1);

  const rounds = [];


  for (
    let round = 0;
    round < 11;
    round++
  ) {

    const currentTeams = [
      fixedTeam,
      ...rotating
    ];

    const pairs = [];


    for (
      let i = 0;
      i < 6;
      i++
    ) {

      pairs.push([
        currentTeams[i],
        currentTeams[11 - i]
      ]);

    }


    rounds.push(
      orientRound(
        pairs,
        round
      )
    );


    const last =
      rotating.pop();

    rotating.unshift(
      last
    );

  }

  return rounds;

}


// ============================
// ALL 22 WEEKS
// ============================

function generateFixtures() {

  const firstHalf =
    generateFirstHalf();


  const secondHalf =
    firstHalf.map(
      round =>

        round.map(
          match => ({
            home:
              match.away,
            away:
              match.home
          })
        )

    );


  fixtures = [
    ...firstHalf,
    ...secondHalf
  ];

}

  const select =
    document.getElementById(
      "weekSelect"
    );

  select.innerHTML = "";


  for (
    let week = 1;
    week <= 22;
    week++
  ) {
