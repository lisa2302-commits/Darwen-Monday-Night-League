function el(id) {
  return document.getElementById(id);
}


// ============================
// LOGIN
// ============================

async function login() {

  const email =
    el("email").value.trim();

  const password =
    el("password").value;

  const message =
    el("loginMessage");


  if (!email || !password) {

    message.textContent =
      "Enter your email and password.";

    return;
  }


  message.textContent =
    "Logging in...";


  const { error } =
    await db.auth.signInWithPassword({
      email,
      password
    });


  if (error) {

    message.textContent =
      "Login failed: " +
      error.message;

    return;
  }


  message.textContent = "";

  await showAdmin();

}


// ============================
// SHOW ADMIN
// ============================

async function showAdmin() {

  el("loginCard").style.display =
    "none";

  el("adminPanel").style.display =
    "block";


  await Promise.all([
    loadSavedResults(),
    loadPlayers(),
    loadCurrentWeek()
  ]);

}


// ============================
// LOGOUT
// ============================

async function logout() {

  await db.auth.signOut();

  el("adminPanel").style.display =
    "none";

  el("loginCard").style.display =
    "block";

  el("password").value = "";

  el("loginMessage").textContent = "";

}


// ============================
// CHECK SESSION
// ============================

async function checkSession() {

  const {
    data: { session }
  } =
    await db.auth.getSession();


  if (session) {

    await showAdmin();

  }

}

function generateFixtures() {

  fixtures =

      round =>
        round.map(
          match => ({
            home: match.home,
            away: match.away
          })
        )
    );

  select.innerHTML = "";


  fixtures[weekIndex]

// ============================
// SAVE RESULT
// ============================

async function saveResult() {

  const homeValue =
    el("homeScore").value;

  const awayValue =
    el("awayScore").value;


  if (
    homeValue === "" ||
    awayValue === ""
  ) {

    el("saveMessage").textContent =
      "Enter both scores.";

    return;

  }


  const weekIndex =
    Number(
      el("weekSelect").value
    );

  const fixtureIndex =
    Number(
      el("fixtureSelect").value
    );

  const match =
    fixtures[
      weekIndex
    ][
      fixtureIndex
    ];

  const weekNumber =
    weekIndex + 1;

  const homeScore =
    Number(homeValue);

  const awayScore =
    Number(awayValue);


  el("saveMessage").textContent =
    "Saving...";


  const {
    data: existing,
    error: checkError
  } =
    await db
      .from("results")
      .select("id")
      .eq(
        "week",
        weekNumber
      )
      .eq(
        "home_team",
        match.home
      )
      .eq(
        "away_team",
        match.away
      )
      .maybeSingle();


  if (checkError) {

    el("saveMessage").textContent =
      "Error: " +
      checkError.message;

    return;

  }


  let error;


  if (existing) {

    ({
      error
    } =
      await db
        .from("results")
        .update({
          home_score:
            homeScore,
          away_score:
            awayScore
        })
        .eq(
          "id",
          existing.id
        )
    );

  }

  else {

    ({
      error
    } =
      await db
        .from("results")
        .insert({
          week:
            weekNumber,
          home_team:
            match.home,
          away_team:
            match.away,
          home_score:
            homeScore,
          away_score:
            awayScore
        })
    );

  }


  if (error) {

    el("saveMessage").textContent =
      "Error: " +
      error.message;

    return;

  }


  el("saveMessage").textContent =
    "✅ Result saved";

  el("homeScore").value = "";

  el("awayScore").value = "";


  await loadSavedResults();

}


// ============================
// MANAGE RESULTS
// ============================

async function loadSavedResults() {

  el("manageResultMessage").textContent =
    "Loading...";


  const {
    data,
    error
  } =
    await db
      .from("results")
      .select("*")
      .order(
        "week",
        { ascending: true }
      )
      .order(
        "id",
        { ascending: true }
      );


  if (error) {

    el("manageResultMessage").textContent =
      "Error: " +
      error.message;

    return;

  }


  savedResults =
    data || [];


  el("savedResultSelect").innerHTML =
    "";


  if (
    !savedResults.length
  ) {

    el("manageResultMessage").textContent =
      "No results saved yet.";

    el("savedResultInfo").textContent =
      "No saved results.";

    el("editHomeScore").value = "";

    el("editAwayScore").value = "";

    return;

  }


  savedResults.forEach(
    result => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        result.id;

      option.textContent =
        `Week ${result.week} - ${result.home_team} ${result.home_score} - ${result.away_score} ${result.away_team}`;

      el("savedResultSelect")
      .appendChild(
        option
      );

    }
  );


  el("manageResultMessage").textContent =
    "";

  showSavedResult();

}


function showSavedResult() {

  const id =
    Number(
      el("savedResultSelect")
      .value
    );


  const result =
    savedResults.find(
      item =>
        Number(item.id)
        === id
    );


  if (!result) {
    return;
  }


  el("savedResultInfo").textContent =
    `Week ${result.week}: ${result.home_team} v ${result.away_team}`;

  el("editHomeScore").value =
    result.home_score;

  el("editAwayScore").value =
    result.away_score;

}


async function updateSavedResult() {

  const id =
    Number(
      el("savedResultSelect")
      .value
    );


  if (!id) {
    return;
  }


  const homeValue =
    el("editHomeScore").value;

  const awayValue =
    el("editAwayScore").value;


  if (
    homeValue === "" ||
    awayValue === ""
  ) {

    el("manageResultMessage").textContent =
      "Enter both scores.";

    return;

  }


  const { error } =
    await db
      .from("results")
      .update({
        home_score:
          Number(homeValue),
        away_score:
          Number(awayValue)
      })
      .eq(
        "id",
        id
      );


  if (error) {

    el("manageResultMessage").textContent =
      "Error: " +
      error.message;

    return;

  }


  await loadSavedResults();

  el("manageResultMessage").textContent =
    "✅ Result updated";

}


async function deleteSavedResult() {

  const id =
    Number(
      el("savedResultSelect")
      .value
    );


  const result =
    savedResults.find(
      item =>
        Number(item.id)
        === id
    );


  if (!result) {
    return;
  }


  const sure =
    confirm(
      `Delete ${result.home_team} ${result.home_score} - ${result.away_score} ${result.away_team}?`
    );


  if (!sure) {
    return;
  }


  const { error } =
    await db
      .from("results")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    el("manageResultMessage").textContent =
      "Error: " +
      error.message;

    return;

  }


  await loadSavedResults();

  el("manageResultMessage").textContent =
    "✅ Result deleted";

}

async function addNewPlayer() {

  const name =
    el("newPlayerName")
    .value
    .trim();

  const team =
    el("newPlayerTeam")
    .value;


  if (!name) {

    el("statsMessage").textContent =
      "Enter the player's name.";

    return;

  }


  el("statsMessage").textContent =
    "Checking player...";


  const {
    data: duplicates,
    error: checkError
  } =
    await db
      .from("player_stats")
      .select("id, player_name, team")
      .ilike(
        "player_name",
        name
      )
      .eq(
        "team",
        team
      )
      .limit(1);


  if (checkError) {

    el("statsMessage").textContent =
      "Error: " +
      checkError.message;

    return;

  }


  if (
    duplicates &&
    duplicates.length > 0
  ) {

    el("statsMessage").textContent =
      "That player is already saved for " +
      team +
      ".";

    await loadPlayers(
      duplicates[0].id
    );

    return;

  }


  const {
    data,
    error
  } =
    await db
      .from("player_stats")
      .insert({
        player_name:
          name,
        team:
          team,
        total_180s:
          0,
        highest_checkout:
          0,
        dominoes_3_0s:
          0
      })
      .select()
      .single();


  if (error) {

    el("statsMessage").textContent =
      "Error: " +
      error.message;

    return;

  }


  el("newPlayerName").value =
    "";


  await loadPlayers(
    data.id
  );


  el("statsMessage").textContent =
    "✅ Player added";

}


// ============================
// ADD +1 PLAYER STAT
// ============================

async function addStat(field) {

  const player =
    getSelectedPlayer();


  if (!player) {

    el("statsMessage").textContent =
      "Choose a saved player first.";

    return;

  }


  const newTotal =
    Number(
      player[field] ||
      0
    ) + 1;


  const updateData = {};

  updateData[field] =
    newTotal;


  const { error } =
    await db
      .from("player_stats")
      .update(
        updateData
      )
      .eq(
        "id",
        player.id
      );


  if (error) {

    el("statsMessage").textContent =
      "Error: " +
      error.message;

    return;

  }


  await loadPlayers(
    player.id
  );


  el("statsMessage").textContent =
    field === "total_180s"
      ? "✅ 180 added"
      : "✅ Dominoes 3–0 added";

}


// ============================
// SAVE HIGHEST CHECKOUT
// ============================

async function saveHighestCheckout() {

  const player =
    getSelectedPlayer();


  if (!player) {

    el("statsMessage").textContent =
      "Choose a saved player first.";

    return;

  }


  const checkout =
    Number(
      el("playerCheckout")
      .value
    );


  if (
    !checkout ||
    checkout < 1 ||
    checkout > 170
  ) {

    el("statsMessage").textContent =
      "Enter a checkout between 1 and 170.";

    return;

  }


  const current =
    Number(
      player.highest_checkout ||
      0
    );


  if (
    checkout <= current
  ) {

    el("statsMessage").textContent =
      "Current highest checkout is " +
      current +
      ". Nothing changed.";

    return;

  }


  const { error } =
    await db
      .from("player_stats")
      .update({
        highest_checkout:
          checkout
      })
      .eq(
        "id",
        player.id
      );


  if (error) {

    el("statsMessage").textContent =
      "Error: " +
      error.message;

    return;

  }


  await loadPlayers(
    player.id
  );


  el("statsMessage").textContent =
    "✅ New highest checkout saved";

}
