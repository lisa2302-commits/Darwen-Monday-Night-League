<body>

<nav>

<div class="container">

Loading current week...
</div>

<label for="weekSelect">
<strong>Select Week:</strong>
</label>

<table>

<thead>
<tr>
<th>Home</th>
<th>Score</th>
<th>Away</th>
</tr>
</thead>

</table>

</div>


<script>

const SUPABASE_URL =
  "https://zczdgjwmewgbkgxoqplm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-YHYKF8Rkw-QkbRrzcW0wA_HjARVvV_";

const { createClient } = supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const teams = [
  "Crown A",
  "Punch",
  "ICI",
  "Golden Cup",
  "The Park Inn",
  "Bird in Hand",
  "Victoria A",
  "Two Gates Club",
  "Funky Room",
  "Entwistle",
  "Crown B",
  "Victoria B"
];


let fixtures = [];

let savedResults = [];


// ============================
// HOME CHECK
// ============================

function isHome(matches, team) {

  const match =
    matches.find(
      m =>
        m.home === team ||
        m.away === team
    );

  if (!match) {
    return false;
  }

  return match.home === team;
}


// ============================
// ORIENT ROUND
// ============================

function orientRound(
  pairs,
  roundNumber
) {

  const defaults =
    pairs.map(
      (pair, index) => {

        if (
          (index + roundNumber) % 2 === 0
        ) {

          return {
            home: pair[0],
            away: pair[1]
          };

        }

        return {
          home: pair[1],
          away: pair[0]
        };

      }
    );


  let best = null;
  let bestFlips = 999;


  for (
    let mask = 0;
    mask < 64;
    mask++
  ) {

    const matches =
      defaults.map(
        (match, index) => {

          if (
            mask & (1 << index)
          ) {

            return {
              home: match.away,
              away: match.home
            };

          }

          return {
            home: match.home,
            away: match.away
          };

        }
      );


    const crownsOK =
      isHome(
        matches,
        "Crown A"
      )
      !==
      isHome(
        matches,
        "Crown B"
      );


    const victoriasOK =
      isHome(
        matches,
        "Victoria A"
      )
      !==
      isHome(
        matches,
        "Victoria B"
      );


    if (
      crownsOK &&
      victoriasOK
    ) {

      let flips = 0;


      for (
        let i = 0;
        i < 6;
        i++
      ) {

        if (
          mask & (1 << i)
        ) {
          flips++;
        }

      }


      if (
        flips < bestFlips
      ) {

        best = matches;
        bestFlips = flips;

      }

    }

  }

  return best;
}


// ============================
// FIRST 11 WEEKS
// ============================

function generateFirstHalf() {

  const fixedTeam =
    teams[0];

  let rotating =
    teams.slice(1);

  const rounds = [];


  for (
    let round = 0;
    round < 11;
    round++
  ) {

    const currentTeams = [
      fixedTeam,
      ...rotating
    ];

    const pairs = [];


    for (
      let i = 0;
      i < 6;
      i++
    ) {

      pairs.push([
        currentTeams[i],
        currentTeams[11 - i]
      ]);

    }


    rounds.push(
      orientRound(
        pairs,
        round
      )
    );


    const last =
      rotating.pop();

    rotating.unshift(
      last
    );

  }


  return rounds;
}


// ============================
// ALL 22 WEEKS
// ============================

function generateFixtures() {

  const firstHalf =
    generateFirstHalf();


  const secondHalf =
    firstHalf.map(
      round =>

        round.map(
          match => ({
            home: match.away,
            away: match.home
          })
        )

    );


  fixtures = [
    ...firstHalf,
    ...secondHalf
  ];
}


// ============================
// LOAD WEEK DROPDOWN
// ============================

function loadWeeks() {

  const select =
    document.getElementById(
      "weekSelect"
    );


  select.innerHTML = "";


  for (
    let week = 1;
    week <= 22;
    week++
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      week - 1;

    option.textContent =
      "Week " + week;

    select.appendChild(
      option
    );

  }


  select.addEventListener(
    "change",
    showFixtures
  );

}


// ============================
// LOAD SAVED RESULTS
// ============================

async function loadResults() {

  const {
    data,
    error
  } =
    await db
      .from("results")
      .select("*");


  if (error) {

    savedResults = [];

    return;

  }


  savedResults =
    data || [];

}


// ============================
// SHOW FIXTURES
// ============================

function showFixtures() {

  const weekIndex =
    Number(
      document.getElementById(
        "weekSelect"
      ).value
    );


  const weekNumber =
    weekIndex + 1;


  const table =
    document.getElementById(
      "fixturesTable"
    );


  table.innerHTML = "";


  fixtures[weekIndex]
  .forEach(
    match => {

      const saved =
        savedResults.find(
          result =>
            Number(result.week) === weekNumber &&
            result.home_team === match.home &&
            result.away_team === match.away
        );


      let middleText = "V";


      if (saved) {

        middleText =
          saved.home_score +
          " - " +
          saved.away_score;

      }


      const row =
        document.createElement(
          "tr"
        );


      row.innerHTML = `
        <td class="home">${match.home}</td>
        <td class="middle">${middleText}</td>
        <td>${match.away}</td>
      `;


      table.appendChild(
        row
      );

    }
  );

}


// ============================
// LOAD CURRENT WEEK
// ============================

async function loadCurrentWeek() {

  const display =
    document.getElementById(
      "currentWeekDisplay"
    );


  const select =
    document.getElementById(
      "weekSelect"
    );


  const {
    data,
    error
  } =
    await db
      .from("league_settings")
      .select("current_week")
      .eq("id", 1)
      .single();


  if (error) {

    display.textContent =
      "📅 Current League Week";

    select.value = 0;

    showFixtures();

    return;

  }


  let currentWeek =
    Number(
      data.current_week
    );


  if (
    currentWeek < 1 ||
    currentWeek > 22
  ) {

    currentWeek = 1;

  }


  display.textContent =
    "📅 Current League Week: Week " +
    currentWeek;


  select.value =
    currentWeek - 1;


  showFixtures();

}


// ============================
// START
// ============================

async function startPage() {

  generateFixtures();

  loadWeeks();

  await loadResults();

  await loadCurrentWeek();

}


startPage();

</script>

</body>
