<body>

<nav>

<div class="container">

<div class="card">

<h2>📅 Fixtures</h2>

<div class="week-box">

<label for="weekSelect"><strong>Select Week:</strong></label>

<select id="weekSelect"></select>

</div>

<table>

<thead>
<tr>
<th>Home</th>
<th></th>
<th>Away</th>
</tr>
</thead>

<tbody id="fixturesTable"></tbody>

</table>

</div>

<script>

const teams = [
  "Crown A",
  "Punch",
  "ICI",
  "Golden Cup",
  "The Park Inn",
  "Bird in Hand",
  "Victoria A",
  "Two Gates Club",
  "Funky Room",
  "Entwistle",
  "Crown B",
  "Victoria B"
];

let fixtures = [];


// ======================================
// CHECK IF A TEAM IS HOME
// ======================================

function isHome(matches, team) {

  const match = matches.find(m =>
    m.home === team || m.away === team
  );

  return match.home === team;
}


// ======================================
// ORIENT EACH WEEK
// Crown A / Crown B opposite home & away
// Victoria A / Victoria B opposite
// ======================================

function orientRound(pairs, roundNumber) {

  let defaults = pairs.map((pair, index) => {

    if ((index + roundNumber) % 2 === 0) {

      return {
        home: pair[0],
        away: pair[1]
      };

    } else {

      return {
        home: pair[1],
        away: pair[0]
      };

    }

  });


  let best = null;
  let bestFlips = 999;


  for (let mask = 0; mask < 64; mask++) {

    let matches = defaults.map((match, index) => {

      if (mask & (1 << index)) {

        return {
          home: match.away,
          away: match.home
        };

      }

      return {
        home: match.home,
        away: match.away
      };

    });


    const crownsOK =
      isHome(matches, "Crown A") !==
      isHome(matches, "Crown B");


    const victoriasOK =
      isHome(matches, "Victoria A") !==
      isHome(matches, "Victoria B");


    if (crownsOK && victoriasOK) {

      let flips = 0;

      for (let i = 0; i < 6; i++) {

        if (mask & (1 << i)) {
          flips++;
        }

      }

      if (flips < bestFlips) {

        best = matches;
        bestFlips = flips;

      }

    }

  }

  return best;
}


// ======================================
// GENERATE 11 WEEKS
// ======================================

function generateFirstHalf() {

  const fixedTeam = teams[0];

  let rotating = teams.slice(1);

  let rounds = [];


  for (let round = 0; round < 11; round++) {

    const currentTeams = [
      fixedTeam,
      ...rotating
    ];

    let pairs = [];


    for (let i = 0; i < 6; i++) {

      pairs.push([
        currentTeams[i],
        currentTeams[11 - i]
      ]);

    }


    const organisedRound =
      orientRound(pairs, round);


    rounds.push(organisedRound);


    const last =
      rotating.pop();

    rotating.unshift(last);

  }

  return rounds;
}


// ======================================
// CREATE HOME & AWAY 22 WEEKS
// ======================================

function generateFixtures() {

  const firstHalf =
    generateFirstHalf();


  const secondHalf =
    firstHalf.map(round => {

      return round.map(match => {

        return {
          home: match.away,
          away: match.home
        };

      });

    });


  fixtures = [
    ...firstHalf,
    ...secondHalf
  ];

}


// ======================================
// LOAD WEEK SELECT
// ======================================

function loadWeeks() {

  const weekSelect =
    document.getElementById("weekSelect");


  weekSelect.innerHTML = "";


  for (let week = 1; week <= 22; week++) {

    const option =
      document.createElement("option");

    option.value =
      week - 1;

    option.textContent =
      "Week " + week;

    weekSelect.appendChild(option);

  }


  weekSelect.addEventListener(
    "change",
    showFixtures
  );

}


// ======================================
// SHOW FIXTURES
// ======================================

function showFixtures() {

  const week =
    Number(
      document.getElementById("weekSelect").value
    );


  const table =
    document.getElementById("fixturesTable");


  table.innerHTML = "";


  fixtures[week].forEach(match => {

    const row =
      document.createElement("tr");


    row.innerHTML = `
      <td class="home">${match.home}</td>
      <td class="vs">V</td>
      <td>${match.away}</td>
    `;


    table.appendChild(row);

  });

}


// ======================================
// START PAGE
// ======================================

generateFixtures();

loadWeeks();

showFixtures();

</script>

</body>
</html>
