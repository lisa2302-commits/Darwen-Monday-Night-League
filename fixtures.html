<body>

<div class="container">

Loading current week...
</div>

</div>

<table>
<thead>
<tr>
<th>Home</th>
<th>Score</th>
<th>Away</th>
</tr>
</thead>

</table>

</div>
</div>

<script>

const SUPABASE_URL =
  "https://zczdgjwmewgbkgxoqplm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-YHYKF8Rkw-QkbRrzcW0wA_HjARVvV_";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const teams = [
  "Crown A",
  "Punch",
  "ICI",
  "The Anchor",
  "The Park Inn",
  "Bird in Hand",
  "Victoria A",
  "Two Gates Club",
  "Funky Room",
  "Entwistle",
  "Crown B",
  "Victoria B",
  "Coopers Bar",
  "Darwen Football Club"
];

const WEEKS_PER_HALF = teams.length - 1;
const MATCHES_PER_WEEK = teams.length / 2;
const TOTAL_WEEKS = WEEKS_PER_HALF * 2;

let fixtures = [];
let savedResults = [];

function isHome(matches, team) {
  const match = matches.find(
    m => m.home === team || m.away === team
  );

  return match ? match.home === team : false;
}

function orientRound(pairs, roundNumber) {

  const defaults = pairs.map((pair, index) => {
    if ((index + roundNumber) % 2 === 0) {
      return {
        home: pair[0],
        away: pair[1]
      };
    }

    return {
      home: pair[1],
      away: pair[0]
    };
  });

  let best = defaults;
  let bestFlips = Infinity;
  const combinations = 1 << pairs.length;

  for (let mask = 0; mask < combinations; mask++) {

    const matches = defaults.map((match, index) => {
      if (mask & (1 << index)) {
        return {
          home: match.away,
          away: match.home
        };
      }

      return {
        home: match.home,
        away: match.away
      };
    });

    const crownsOK =
      isHome(matches, "Crown A") !==
      isHome(matches, "Crown B");

    const victoriasOK =
      isHome(matches, "Victoria A") !==
      isHome(matches, "Victoria B");

    if (crownsOK && victoriasOK) {
      let flips = 0;

      for (let i = 0; i < pairs.length; i++) {
        if (mask & (1 << i)) {
          flips++;
        }
      }

      if (flips < bestFlips) {
        best = matches;
        bestFlips = flips;
      }
    }
  }

  return best;
}

function generateFirstHalf() {

  const fixedTeam = teams[0];
  let rotating = teams.slice(1);
  const rounds = [];

  for (let round = 0; round < WEEKS_PER_HALF; round++) {

    const current = [
      fixedTeam,
      ...rotating
    ];

    const pairs = [];

    for (let i = 0; i < MATCHES_PER_WEEK; i++) {
      pairs.push([
        current[i],
        current[current.length - 1 - i]
      ]);
    }

    rounds.push(
      orientRound(
        pairs,
        round
      )
    );

    rotating.unshift(
      rotating.pop()
    );
  }

  return rounds;
}

function generateFixtures() {

  const firstHalf =
    generateFirstHalf();

  const secondHalf =
    firstHalf.map(
      round =>
        round.map(
          match => ({
            home: match.away,
            away: match.home
          })
        )
    );

  fixtures = [
    ...firstHalf,
    ...secondHalf
  ];
}

function loadWeeks() {

  const select =
    document.getElementById("weekSelect");

  select.innerHTML = "";

  for (let week = 1; week <= TOTAL_WEEKS; week++) {

    const option =
      document.createElement("option");

    option.value =
      week - 1;

    option.textContent =
      "Week " + week;

    select.appendChild(option);
  }

  select.addEventListener(
    "change",
    showFixtures
  );
}

async function loadResults() {

  const {
    data,
    error
  } =
    await db
      .from("results")
      .select("*");

  savedResults =
    error ? [] : (data || []);
}

function showFixtures() {

  const weekIndex =
    Number(
      document.getElementById("weekSelect").value
    );

  const weekNumber =
    weekIndex + 1;

  const table =
    document.getElementById("fixturesTable");

  table.innerHTML = "";

  fixtures[weekIndex]
  .forEach(match => {

    const saved =
      savedResults.find(
        result =>
          Number(result.week) === weekNumber &&
          result.home_team === match.home &&
          result.away_team === match.away
      );

    const middleText =
      saved
        ? saved.home_score + " - " + saved.away_score
        : "V";

    const row =
      document.createElement("tr");

    row.innerHTML = `
      <td class="home">${match.home}</td>
      <td class="middle">${middleText}</td>
      <td>${match.away}</td>
    `;

    table.appendChild(row);
  });
}

async function loadCurrentWeek() {

  const display =
    document.getElementById("currentWeekDisplay");

  const select =
    document.getElementById("weekSelect");

  const {
    data,
    error
  } =
    await db
      .from("league_settings")
      .select("current_week")
      .eq("id", 1)
      .single();

  let currentWeek =
    error
      ? 1
      : Number(data.current_week);

  if (
    currentWeek < 1 ||
    currentWeek > TOTAL_WEEKS
  ) {
    currentWeek = 1;
  }

  display.textContent =
    "📅 Current League Week: Week " +
    currentWeek;

  select.value =
    currentWeek - 1;

  showFixtures();
}

async function startPage() {
  generateFixtures();
  loadWeeks();
  await loadResults();
  await loadCurrentWeek();
}

startPage();

</script>

</body>
</html>
