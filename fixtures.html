let savedResults = [];

function loadWeeks() {
  const select =
    document.getElementById("weekSelect");

  select.innerHTML = "";

  for (let week = 1; week <= TOTAL_WEEKS; week++) {
    const option =
      document.createElement("option");

    option.value = week - 1;
    option.textContent = "Week " + week;
    select.appendChild(option);
  }

  select.addEventListener(
    "change",
    showFixtures
  );
}

async function loadResults() {
  const {
    data,
    error
  } =
    await db
      .from("results")
      .select("*");

  savedResults =
    error ? [] : (data || []);
}

function showFixtures() {
  const weekIndex =
    Number(
      document.getElementById("weekSelect").value
    );

  const weekNumber =
    weekIndex + 1;

  const table =
    document.getElementById("fixturesTable");

  table.innerHTML = "";

  FIXTURE_SCHEDULE[weekIndex]
  .forEach(match => {
    const saved =
      savedResults.find(
        result =>
          Number(result.week) === weekNumber &&
          result.home_team === match.home &&
          result.away_team === match.away
      );

    const middleText =
      saved
        ? saved.home_score + " - " + saved.away_score
        : "V";

    const row =
      document.createElement("tr");

    row.innerHTML = `
      <td class="home">${match.home}</td>
      <td class="middle">${middleText}</td>
      <td>${match.away}</td>
    `;

    table.appendChild(row);
  });
}

async function loadCurrentWeek() {
  const display =
    document.getElementById("currentWeekDisplay");

  const select =
    document.getElementById("weekSelect");

  const {
    data,
    error
  } =
    await db
      .from("league_settings")
      .select("current_week")
      .eq("id", 1)
      .single();

  let currentWeek =
    error ? 1 : Number(data.current_week);

  if (
    currentWeek < 1 ||
    currentWeek > TOTAL_WEEKS
  ) {
    currentWeek = 1;
  }

  display.textContent =
    "📅 Current League Week: Week " +
    currentWeek;

  select.value =
    currentWeek - 1;

  showFixtures();
}

async function startPage() {
  loadWeeks();
  await loadResults();
  await loadCurrentWeek();
}

startPage();
