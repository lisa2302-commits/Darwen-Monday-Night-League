<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stats - Monday Nite League</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
  margin: 0;
}

header {
  background: #0f172a;
  padding: 20px;
  text-align: center;
  border-bottom: 3px solid #facc15;
}

header h1 {
  margin: 0;
  color: #facc15;
}

nav {
  background: #1e293b;
  text-align: center;
  padding: 12px;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 8px;
  font-weight: bold;
}

nav a:hover {
  color: #facc15;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
  overflow-x: auto;
}

h2 {
  text-align: center;
  color: #facc15;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #facc15;
  color: #111827;
  padding: 10px;
}

td {
  padding: 10px;
  text-align: center;
  border-bottom: 1px solid #475569;
}

td:nth-child(2),
td:nth-child(3) {
  text-align: left;
}

.position {
  color: #facc15;
  font-weight: bold;
}

.stat-number {
  color: #facc15;
  font-weight: bold;
  font-size: 18px;
}

.message {
  text-align: center;
  color: #cbd5e1;
  padding: 20px;
}

</style>
</head>

<body>

<header>
<h1>🎯 Monday Nite Darts & Dominoes League</h1>
</header>

<nav>
<a href="index.html">🏆 League</a>
<a href="fixtures.html">📅 Fixtures</a>
<a href="results.html">📝 Results</a>
<a href="stats.html">📊 Stats</a>
<a href="admin.html">🔐 Admin</a>
</nav>

<div class="container">

<div class="card">

<h2>🎯 Most 180s</h2>

<table id="table180" style="display:none;">

<thead>
<tr>
<th>Pos</th>
<th>Player</th>
<th>Team</th>
<th>180s</th>
</tr>
</thead>

<tbody id="body180"></tbody>

</table>

<div id="message180" class="message">
Loading 180s...
</div>

</div>


<div class="card">

<h2>🔥 Highest Checkout</h2>

<table id="checkoutTable" style="display:none;">

<thead>
<tr>
<th>Pos</th>
<th>Player</th>
<th>Team</th>
<th>Checkout</th>
</tr>
</thead>

<tbody id="checkoutBody"></tbody>

</table>

<div id="checkoutMessage" class="message">
Loading checkouts...
</div>

</div>


<div class="card">

<h2>🁫 Most Dominoes 3–0s</h2>

<table id="dominoesTable" style="display:none;">

<thead>
<tr>
<th>Pos</th>
<th>Player</th>
<th>Team</th>
<th>3–0s</th>
</tr>
</thead>

<tbody id="dominoesBody"></tbody>

</table>

<div id="dominoesMessage" class="message">
Loading dominoes 3–0s...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://zczdgjwmewgbkgxoqplm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-YHYKF8Rkw-QkbRrzcW0wA_HjARVvV_";

const { createClient } = supabase;

const db =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// LOAD ALL STATS

async function loadStats() {

  const {
    data,
    error
  } =
  await db
    .from("player_stats")
    .select("*");


  if (error) {

    document.getElementById("message180")
    .textContent =
    "Unable to load stats.";

    document.getElementById("checkoutMessage")
    .textContent =
    "Unable to load stats.";

    document.getElementById("dominoesMessage")
    .textContent =
    "Unable to load stats.";

    return;
  }


  show180s(data || []);
  showCheckouts(data || []);
  showDominoes(data || []);

}


// MOST 180s

function show180s(data) {

  const players =
  [...data]
  .filter(player =>
    Number(player.total_180s) > 0
  )
  .sort((a, b) =>
    Number(b.total_180s) -
    Number(a.total_180s)
  );


  if (players.length === 0) {

    document.getElementById("message180")
    .textContent =
    "No 180s entered yet.";

    return;
  }


  const body =
  document.getElementById("body180");

  body.innerHTML = "";


  players.forEach((player, index) => {

    const row =
    document.createElement("tr");

    row.innerHTML = `
      <td class="position">${index + 1}</td>
      <td>${player.player_name}</td>
      <td>${player.team}</td>
      <td class="stat-number">${player.total_180s}</td>
    `;

    body.appendChild(row);

  });


  document.getElementById("message180")
  .style.display = "none";

  document.getElementById("table180")
  .style.display = "table";

}


// HIGHEST CHECKOUT

function showCheckouts(data) {

  const players =
  [...data]
  .filter(player =>
    Number(player.highest_checkout) > 0
  )
  .sort((a, b) =>
    Number(b.highest_checkout) -
    Number(a.highest_checkout)
  );


  if (players.length === 0) {

    document.getElementById("checkoutMessage")
    .textContent =
    "No checkouts entered yet.";

    return;
  }


  const body =
  document.getElementById("checkoutBody");

  body.innerHTML = "";


  players.forEach((player, index) => {

    const row =
    document.createElement("tr");

    row.innerHTML = `
      <td class="position">${index + 1}</td>
      <td>${player.player_name}</td>
      <td>${player.team}</td>
      <td class="stat-number">${player.highest_checkout}</td>
    `;

    body.appendChild(row);

  });


  document.getElementById("checkoutMessage")
  .style.display = "none";

  document.getElementById("checkoutTable")
  .style.display = "table";

}


// MOST DOMINOES 3-0s

function showDominoes(data) {

  const players =
  [...data]
  .filter(player =>
    Number(player.dominoes_3_0s) > 0
  )
  .sort((a, b) =>
    Number(b.dominoes_3_0s) -
    Number(a.dominoes_3_0s)
  );


  if (players.length === 0) {

    document.getElementById("dominoesMessage")
    .textContent =
    "No dominoes 3–0s entered yet.";

    return;
  }


  const body =
  document.getElementById("dominoesBody");

  body.innerHTML = "";


  players.forEach((player, index) => {

    const row =
    document.createElement("tr");

    row.innerHTML = `
      <td class="position">${index + 1}</td>
      <td>${player.player_name}</td>
      <td>${player.team}</td>
      <td class="stat-number">${player.dominoes_3_0s}</td>
    `;

    body.appendChild(row);

  });


  document.getElementById("dominoesMessage")
  .style.display = "none";

  document.getElementById("dominoesTable")
  .style.display = "table";

}


// START

loadStats();

</script>

</body>
</html>
