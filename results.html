<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results - Monday Nite League</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
  margin: 0;
}

header {
  background: #0f172a;
  padding: 20px;
  text-align: center;
  border-bottom: 3px solid #facc15;
}

header h1 {
  margin: 0;
  color: #facc15;
}

nav {
  background: #1e293b;
  text-align: center;
  padding: 12px;

  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  background: #334155;
  padding: 9px 12px;
  border-radius: 6px;
}

nav a:hover {
  color: #facc15;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  overflow-x: auto;
}

h2 {
  text-align: center;
  color: #facc15;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #facc15;
  color: #111827;
  padding: 10px;
}

td {
  padding: 10px;
  text-align: center;
  border-bottom: 1px solid #475569;
}

.score {
  color: #facc15;
  font-weight: bold;
  font-size: 18px;
}

.message {
  text-align: center;
  padding: 25px;
  color: #cbd5e1;
}

@media (max-width: 600px) {

  header {
    padding: 15px 8px;
  }

  header h1 {
    font-size: 22px;
  }

  nav {
    padding: 10px 5px;
  }

  nav a {
    font-size: 14px;
    padding: 8px 9px;
  }

  .container {
    padding: 10px;
  }

  .card {
    padding: 10px;
  }

  table {
    font-size: 13px;
  }

  th,
  td {
    padding: 8px 5px;
  }

  .score {
    font-size: 16px;
  }
}

</style>

</head>

<body>

<header>
<h1>🎯 Monday Nite Darts & Dominoes League</h1>
</header>

<nav>
<a href="index.html">🏆 League</a>
<a href="fixtures.html">📅 Fixtures</a>
<a href="results.html">📝 Results</a>
<a href="stats.html">📊 Stats</a>

</nav>

<div class="container">

<div class="card">

<h2>📝 Results</h2>

<table id="resultsTable" style="display:none;">

<thead>
<tr>
<th>Week</th>
<th>Home</th>
<th>Score</th>
<th>Away</th>
</tr>
</thead>

<tbody id="resultsBody"></tbody>

</table>

<div id="message" class="message">
Loading results...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
  "https://zczdgjwmewgbkgxoqplm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-YHYKF8Rkw-QkbRrzcW0wA_HjARVvV_";

const { createClient } = supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ============================
// LOAD RESULTS
// ============================

async function loadResults() {

  const message =
    document.getElementById(
      "message"
    );

  const table =
    document.getElementById(
      "resultsTable"
    );

  const body =
    document.getElementById(
      "resultsBody"
    );


  const {
    data,
    error
  } =
    await db
      .from("results")
      .select("*")
      .order(
        "week",
        { ascending: true }
      )
      .order(
        "id",
        { ascending: true }
      );


  if (error) {

    message.textContent =
      "Unable to load results.";

    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    message.textContent =
      "No results entered yet.";

    table.style.display =
      "none";

    return;
  }


  body.innerHTML = "";


  data.forEach(
    result => {

      const row =
        document.createElement(
          "tr"
        );


      const weekCell =
        document.createElement(
          "td"
        );

      const homeCell =
        document.createElement(
          "td"
        );

      const scoreCell =
        document.createElement(
          "td"
        );

      const awayCell =
        document.createElement(
          "td"
        );


      weekCell.textContent =
        "Week " +
        result.week;


      homeCell.textContent =
        result.home_team;


      scoreCell.textContent =
        result.home_score +
        " - " +
        result.away_score;

      scoreCell.className =
        "score";


      awayCell.textContent =
        result.away_team;


      row.appendChild(
        weekCell
      );

      row.appendChild(
        homeCell
      );

      row.appendChild(
        scoreCell
      );

      row.appendChild(
        awayCell
      );


      body.appendChild(
        row
      );

    }
  );


  message.style.display =
    "none";

  table.style.display =
    "table";

}


// ============================
// START
// ============================

loadResults();

</script>

</body>
</html>
