<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monday Nite Darts & Dominoes League</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
  margin: 0;
}

header {
  background: #0f172a;
  padding: 20px;
  text-align: center;
  border-bottom: 3px solid #facc15;
}

header h1 {
  margin: 0;
  color: #facc15;
}

nav {
  background: #1e293b;
  text-align: center;
  padding: 12px;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 8px;
  font-weight: bold;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 15px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  overflow-x: auto;
}

h2 {
  text-align: center;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #facc15;
  color: #111827;
  padding: 10px;
}

td {
  padding: 10px;
  text-align: center;
  border-bottom: 1px solid #475569;
}

td:nth-child(2) {
  text-align: left;
  font-weight: bold;
}

.position {
  color: #facc15;
  font-weight: bold;
}

</style>

</head>

<body>

<header>
<h1>🎯 Monday Nite Darts & Dominoes League</h1>
</header>

<nav>
<a href="index.html">🏆 League</a>
<a href="fixtures.html">📅 Fixtures</a>
<a href="results.html">📝 Results</a>
<a href="stats.html">📊 Stats</a>
<a href="admin.html">🔐 Admin</a>
</nav>

<div class="container">

<div class="card">

<h2>🏆 League Table</h2>

<table>

<thead>

<tr>
<th>Pos</th>
<th>Team</th>
<th>P</th>
<th>W</th>
<th>D</th>
<th>L</th>
<th>Pts</th>
</tr>

</thead>

<tbody id="leagueTable"></tbody>

</table>

</div>

</div>

<script>

const teams = [
"Crown A",
"Punch",
"ICI",
"Golden Cup",
"The Park Inn",
"Bird in Hand",
"Victoria A",
"Two Gates Club",
"Funky Room",
"Entwistle",
"Crown B",
"Victoria B"
];

const table = document.getElementById("leagueTable");

teams.forEach((team, index) => {

const row = document.createElement("tr");

row.innerHTML = `
<td class="position">${index + 1}</td>
<td>${team}</td>
<td>0</td>
<td>0</td>
<td>0</td>
<td>0</td>
<td>0</td>
`;

table.appendChild(row);

});

</script>

</body>

</html>
